server {
    listen 80;
    server_name _; # Accepts any IP or Domain name

    # 1. Serve the Frontend HTML/JS/CSS
    location / {
        root /usr/share/nginx/html;
        index log.html;
        try_files $uri $uri/ /log.html;
    }

    # 2. Proxy API requests to the hidden C# Container
    location /api/ {
        # 'api-backend' is the exact name of the container in our docker-compose file
        proxy_pass http://api-backend:8080/api/;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}